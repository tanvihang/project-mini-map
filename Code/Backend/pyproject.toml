[project]
name = "minimap-backend"
version = "0.1.0"
description = "Mini-Map backend — single-gateway modular monolith (logical microservices) on FastAPI."
requires-python = ">=3.11"

# Dependencies are tracked in requirements.txt (the team lockfile).
# This file owns tooling config only: Google-style formatting + lint + tests.

[tool.black]
line-length = 80          # Google Python Style
target-version = ["py311"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
# Google-style selection: pycodestyle, pyflakes, isort, pyupgrade,
# bugbear, naming, comprehensions, and docstrings.
select = ["E", "F", "I", "UP", "B", "N", "C4", "D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (Google uses D212)
    "E501",  # line length is owned by black; residual long strings are intentional
    "D101",  # self-descriptive Pydantic data models don't need class docstrings
    "D103",  # small RPC handlers/validators are self-documenting
    "D107",  # __init__ docstrings not required
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # tests don't need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"     # all async tests run without explicit marks
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]        # make the `app` package importable from repo root
addopts = "-q"
